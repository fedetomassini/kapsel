name: Bug report
description: Report reproducible Kapsel behavior that is incorrect or regressed.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private paths, or sensitive machine information.
  - type: input
    id: version
    attributes:
      label: Kapsel version
      placeholder: 1.2.0
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the incorrect behavior in one clear paragraph.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Kapsel
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Windows version:
        PowerShell version:
        winget available/version:
        Chocolatey available/version:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Activity output or screenshots
      description: Include safe Activity text, screenshots, or provider exit codes.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and sensitive environment data.
          required: true
