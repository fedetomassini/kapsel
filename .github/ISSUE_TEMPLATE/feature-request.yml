name: Feature request
description: Propose a focused improvement to the Kapsel catalog workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem cannot be solved by Kapsel today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow
      description: Explain where this fits in discovery, selection, confirmation, execution, or results.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Catalog
        - Package operations
        - Interface
        - Packaging and releases
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request keeps Kapsel focused on installing and updating curated applications.
          required: true
        - label: I checked existing issues for the same request.
          required: true
