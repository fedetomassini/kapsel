name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and package
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Validate PowerShell syntax
        run: npm run validate

      - name: Setup Pester 4
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1 -Force

      - name: Run tests
        run: npm test

      - name: Test documentation tooling
        run: npm run test:tooling

      - name: Validate documentation and versions
        run: npm run docs:check

      - name: Verify generated application catalog
        run: npm run docs:catalog:check

      - name: Validate release package structure
        shell: pwsh
        run: ./build.ps1 -SkipExecutable
