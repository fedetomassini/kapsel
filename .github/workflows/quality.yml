name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PowerShell tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pester is the slowest setup step. Cache the exact module version and skip
      # the gallery round-trip when the runner restores it.
      - name: Cache Pester 4.10.1
        id: pester-cache
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules\Pester
          key: pester-4.10.1-windows-v2

      - name: Install Pester 4.10.1
        if: steps.pester-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $moduleRoot = Join-Path $env:USERPROFILE 'Documents\WindowsPowerShell\Modules\Pester\4.10.1'
          if (Test-Path -LiteralPath $moduleRoot) { Remove-Item -LiteralPath $moduleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $moduleRoot -Force | Out-Null
          $package = Join-Path $env:TEMP 'pester-4.10.1.zip'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://www.powershellgallery.com/api/v2/package/Pester/4.10.1' -OutFile $package -UseBasicParsing
          Expand-Archive -LiteralPath $package -DestinationPath $moduleRoot -Force
          Import-Module (Join-Path $moduleRoot 'Pester.psd1') -Force

      - name: Validate syntax and run tests
        shell: powershell
        run: |
          npm run check:source
          exit $LASTEXITCODE

  static:
    name: Tooling, documentation, and package
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Cache PSScriptAnalyzer
        id: analyzer-cache
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules\PSScriptAnalyzer
          key: psscriptanalyzer-1.25.0-windows-v2

      - name: Install PSScriptAnalyzer
        if: steps.analyzer-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $moduleRoot = Join-Path $env:USERPROFILE 'Documents\WindowsPowerShell\Modules\PSScriptAnalyzer\1.25.0'
          if (Test-Path -LiteralPath $moduleRoot) { Remove-Item -LiteralPath $moduleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $moduleRoot -Force | Out-Null
          $package = Join-Path $env:TEMP 'psscriptanalyzer-1.25.0.zip'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://www.powershellgallery.com/api/v2/package/PSScriptAnalyzer/1.25.0' -OutFile $package -UseBasicParsing
          Expand-Archive -LiteralPath $package -DestinationPath $moduleRoot -Force
          Import-Module (Join-Path $moduleRoot 'PSScriptAnalyzer.psd1') -Force

      - name: Validate tooling, documentation, and package
        run: npm run check:docs

      - name: Run PSScriptAnalyzer baseline gate
        run: npm run analyze:ci

      - name: Validate release package structure
        run: npm run build:check
