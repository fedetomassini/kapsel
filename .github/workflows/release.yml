name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $version = [string] $package.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'package.json does not define a version.'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version '$version' is not semantic version x.y.z."
          }

          Import-Module ./src/modules/Shared/ProductMetadata.psm1 -Force
          $metadata = Get-KapselProductMetadata
          if ([string] $metadata.Version -ne $version) {
            throw "package.json version '$version' does not match app metadata version '$($metadata.Version)'."
          }

          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$env:GITHUB_REF_NAME' is not semantic version vX.Y.Z."
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $version) {
            throw "Tag version '$tagVersion' does not match package.json version '$version'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate PowerShell syntax
        run: npm run validate

      - name: Setup Pester 4
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1 -Force

      - name: Run tests
        run: npm test

      - name: Verify generated application catalog
        run: npm run docs:catalog:check

      - name: Build release package
        shell: pwsh
        run: ./build.ps1 -InstallBuildDependency

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $archive = Join-Path $PWD "dist/releases/Kapsel-$env:RELEASE_VERSION-windows.zip"
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Release archive not found: $archive"
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive --clobber
          }
          else {
            gh release create $env:RELEASE_TAG $archive `
              --verify-tag `
              --title "Kapsel $env:RELEASE_VERSION" `
              --generate-notes `
              --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE."
          }
