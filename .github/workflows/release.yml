name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      # Match the Quality workflow so a tag run reuses the same cached module.
      - name: Cache Pester 4.10.1
        id: pester-cache
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules\Pester
          key: pester-4.10.1-windows-v2

      - name: Install Pester 4.10.1
        if: steps.pester-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $moduleRoot = Join-Path $env:USERPROFILE 'Documents\WindowsPowerShell\Modules\Pester\4.10.1'
          if (Test-Path -LiteralPath $moduleRoot) { Remove-Item -LiteralPath $moduleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $moduleRoot -Force | Out-Null
          $package = Join-Path $env:TEMP 'pester-4.10.1.zip'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://www.powershellgallery.com/api/v2/package/Pester/4.10.1' -OutFile $package -UseBasicParsing
          Expand-Archive -LiteralPath $package -DestinationPath $moduleRoot -Force
          Import-Module (Join-Path $moduleRoot 'Pester.psd1') -Force

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $version = [string] $package.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'package.json does not define a version.'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version '$version' is not semantic version x.y.z."
          }

          Import-Module ./src/modules/Shared/ProductMetadata.psm1 -Force
          $metadata = Get-KapselProductMetadata
          if ([string] $metadata.Version -ne $version) {
            throw "package.json version '$version' does not match app metadata version '$($metadata.Version)'."
          }

          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$env:GITHUB_REF_NAME' is not semantic version vX.Y.Z."
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $version) {
            throw "Tag version '$tagVersion' does not match package.json version '$version'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate syntax and run tests
        shell: powershell
        run: |
          npm run check:source
          exit $LASTEXITCODE

      - name: Validate tooling and documentation
        run: npm run check:docs

      - name: Cache PSScriptAnalyzer
        id: analyzer-cache
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules\PSScriptAnalyzer
          key: psscriptanalyzer-1.25.0-windows-v2

      - name: Install PSScriptAnalyzer
        if: steps.analyzer-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $moduleRoot = Join-Path $env:USERPROFILE 'Documents\WindowsPowerShell\Modules\PSScriptAnalyzer\1.25.0'
          if (Test-Path -LiteralPath $moduleRoot) { Remove-Item -LiteralPath $moduleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $moduleRoot -Force | Out-Null
          $package = Join-Path $env:TEMP 'psscriptanalyzer-1.25.0.zip'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://www.powershellgallery.com/api/v2/package/PSScriptAnalyzer/1.25.0' -OutFile $package -UseBasicParsing
          Expand-Archive -LiteralPath $package -DestinationPath $moduleRoot -Force
          Import-Module (Join-Path $moduleRoot 'PSScriptAnalyzer.psd1') -Force

      - name: Run PSScriptAnalyzer baseline gate
        run: npm run analyze:ci

      - name: Build release package
        shell: pwsh
        run: ./build.ps1

      - name: Verify release checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = Join-Path $PWD "dist/releases/Kapsel-$env:RELEASE_VERSION-windows.zip"
          $checksumFile = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $checksumFile)) {
            throw "Release checksum not found: $checksumFile"
          }
          $recorded = ((Get-Content -LiteralPath $checksumFile -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($recorded -ne $actual) {
            throw "Release checksum does not match the archive: $archive"
          }
          Write-Host "Verified SHA-256 $actual"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $archive = Join-Path $PWD "dist/releases/Kapsel-$env:RELEASE_VERSION-windows.zip"
          $checksum = "$archive.sha256"
          foreach ($asset in @($archive, $checksum)) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Release asset not found: $asset"
            }
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive $checksum --clobber
          }
          else {
            gh release create $env:RELEASE_TAG $archive $checksum `
              --verify-tag `
              --title "Kapsel $env:RELEASE_VERSION" `
              --generate-notes `
              --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE."
          }
